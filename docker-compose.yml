services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT} --reload"
    ports: ["${BACKEND_PORT}:${BACKEND_PORT}"]
    volumes: [./backend:/app]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:${BACKEND_PORT}/api/v1/health')\""]
      interval: 10s
      retries: 10

  frontend:
    build: ./frontend
    env_file: .env
    command: npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}
    ports: ["${FRONTEND_PORT}:${FRONTEND_PORT}"]
    volumes: [./frontend:/app, /app/node_modules]
    depends_on: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${FRONTEND_PORT}/ || exit 1"]
      interval: 10s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@twin.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["${PGADMIN_PORT}:80"]
    depends_on: [db]

volumes:
  pgdata:
